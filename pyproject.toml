[project]
name = "photo3x4"
version = "0.1.0"
description = "Gerador local de fotos 3x4 brasileiras a partir de selfies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "pillow>=10.4.0",
    "python-multipart>=0.0.9",
    "rembg[cpu]>=2.0.59",
    "sentry-sdk[fastapi]>=2.72.0",
    "typer>=0.12.5",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
photo3x4 = "src.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
